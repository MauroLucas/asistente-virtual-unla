services:
  # Base de CONOCIMIENTO (tus datos de negocio)
  postgres_kb:
    image: postgres:15
    container_name: postgres_kb
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # ej: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} # ej: knowledge_db
      TZ: ${TZ}
    ports:
      - "5433:5432" # Host -> Contenedor
    volumes:
      - postgres_kb_data:/var/lib/postgresql/data
      - ./postgres_kb/initdb_kb:/docker-entrypoint-initdb.d:ro

  # Postgres EXCLUSIVO para n8n
  postgres_n8n:
    image: postgres:15
    container_name: postgres_n8n
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${N8N_USER}
      POSTGRES_PASSWORD: ${N8N_PASSWORD}
      POSTGRES_DB: ${N8N_DB} # ej: n8n_db
      TZ: ${TZ}
    ports:
      - "5435:5432" # Host -> Contenedor
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    env_file:
      - ./.env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB}
      - DB_POSTGRESDB_USER=${N8N_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    ports:
      - "5678:5678" # UI de n8n
    depends_on:
      - postgres_n8n

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434" # API de Ollama
    volumes:
      - ollama_data:/root/.ollama
    

  open-webui:
    build: 
      context: ./open-webui-theme 
      dockerfile: Dockerfile 
    # image: ghcr.io/open-webui/open-webui:v0.6.29
    container_name: open-webui
    # ajustar según tag
    ports:
      - "3000:8080"
    environment:
      # Configuración de Interfaz
      # Establece el nombre principal de la interfaz web.
      - WEBUI_NAME=UNLa Asistente Virtual Académico 
      # Establece el idioma por defecto de la interfaz
      - DEFAULT_LOCALE=es
      # Oculta información administrativa (como el email del admin) a usuarios normales
      - SHOW_ADMIN_DETAILS=False
      # Controla si a los usuarios se les muestra el botón compartir en la comunidad.
      - ENABLE_COMMUNITY_SHARING=False
      # Habilita la función de calificación de mensajes (útil para métricas).
      - ENABLE_MESSAGE_RATING=True

      # Configuración esencial de modelos
      # Configura la URL del backend de Ollama.
      # - OLLAMA_BASE_URL=http://ollama:11434
      # Establece un modelo de lenguaje predeterminado.
      # - DEFAULT_MODELS=llama3:8b-instruct-q4_0

      # Configuración de Conexión a Modelos/API
      - OLLAMA_BASE_URL=http://ollama:11434
      # Permite el uso de las API de OpenAI.
      - ENABLE_OPENAI_API=True 
      # Configura la URL de la API base de OpenAI.
      - OPENAI_API_BASE_URL=http://n8n:5678/webhook/v1
      # Establece la clave API de OpenAI.
      - OPENAI_API_KEY=dummy-key # n8n no requiere key real para webhooks
      # Establece un modelo de lenguaje predeterminado.
      - DEFAULT_MODELS=UNLa_Asistente_Virtual_Académico

      # Deshabilitar características que pueden mostrar Arena Model
      - ENABLE_EVALUATION_ARENA_MODELS=False
      
      # Control de persistencia / caché
      # Las variables de configuración se leen siempre de las variables de entorno 
      # en cada reinicio
      - ENABLE_PERSISTENT_CONFIG=False
      # Se desactiva la caché. Cada solicitud de lista de modelos consulta directamente a los 
      # proveedores (Ollama/OpenAI)
      - MODELS_CACHE_TTL=0
      
      
      # Configuración de Autenticación
      # Esta configuración habilita o deshabilita el sistema de autenticación.
      - WEBUI_AUTH=False 
      # Activa o desactiva la creación de cuentas de usuario.
      - ENABLE_SIGNUP=False
      # Oculta el formulario de login
      - ENABLE_LOGIN_FORM=False
      # Establece el rol predeterminado asignado a los nuevos usuarios.
      - DEFAULT_USER_ROLE=user # Los nuevos usuarios se activan automáticamente con permisos de usuario normales.
      # Habilita o deshabilita la búsqueda web.
      - ENABLE_WEB_SEARCH=False
      # Activa el guardado en tiempo real de las conversaciones en la base de datos de 
      # Open WebUI
      - ENABLE_REALTIME_CHAT_SAVE=True
      # Indica que Open WebUI debe reenviar al backend (tu API/n8n) cabeceras 
      # HTTP con información del usuario
      - ENABLE_FORWARD_USER_INFO_HEADERS=True
      # Controla la política SameSite de las cookies de sesión de Open WebUI.
      # lax: permite cookies en la mayoría de casos de navegación, pero bloquea algunos 
      # contextos cross-site inseguros.
      - WEBUI_SESSION_COOKIE_SAME_SITE=lax
      # Define si las cookies de sesión solo deben enviarse por conexiones HTTPS.
      # Si True: las cookies solo viajan por HTTPS.
      # Si False: también viajan por HTTP (útil en entornos de desarrollo local 
      # sin certificado).
      - WEBUI_SESSION_COOKIE_SECURE=False
      # Controla si los administradores pueden exportar datos, chats y la base de datos 
      # en el panel de administración. Por ahora, la exportación de bases de datos solo 
      # funciona con bases de datos SQLite.
      - ENABLE_ADMIN_EXPORT=False
      # Permite a los administradores acceder directamente a los chats de otros usuarios. 
      # Al deshabilitar esta opción, los administradores ya no pueden acceder a los chats 
      # de los usuarios en el panel de administración. Si la deshabilita, considere 
      # deshabilitar también ENABLE_ADMIN_EXPORT si usa SQLite, ya que las exportaciones 
      # también contienen los chats de los usuarios.
      - ENABLE_ADMIN_CHAT_ACCESS=False
      # Al deshabilitar esta opción, los administradores se consideran usuarios normales 
      # para el acceso al espacio de trabajo (modelos, conocimiento, indicaciones y 
      # herramientas) y solo ven los elementos para los que tienen permiso explícito 
      # a través del sistema de control de acceso existente. Esto también aplica a la 
      # visibilidad de los modelos en el selector de modelos: los administradores se 
      # considerarán usuarios normales: los modelos base y los modelos personalizados 
      # para los que no tengan permiso explícito permanecerán ocultos. Si se establece 
      # como "Verdadero" (predeterminado), los administradores tendrán acceso a todos los 
      # elementos creados en el área del espacio de trabajo y a todos los modelos en el 
      # selector de modelos, independientemente de sus permisos de acceso.
      # - BYPASS_ADMIN_ACCESS_CONTROL=False
      
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - n8n
      - ollama


  # Servicio de ETL en Python
  etl:
    build:
      context: ./ETL
      dockerfile: Dockerfile
    container_name: etl
    env_file:
      - ./.env
    environment:
      PGHOST: postgres_kb
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATA_DIR: /app/data # donde se montan los Excel
    volumes:
      - ./ETL/data:/app/data:ro # Excel de entrada (solo lectura)
      # (opcional) desarrollo en caliente del código:
      # - ./ETL/app:/app/app:ro
    depends_on:
      - postgres_kb


volumes:
  postgres_kb_data:
  postgres_n8n_data:
  ollama_data:
  openwebui_data:





